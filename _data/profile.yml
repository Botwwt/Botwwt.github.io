intro:
  en: I am an <strong>incoming Ph.D. student (2027 entry)</strong> at the <a href="https://future.pku.edu.cn/">College of Future Technology, Peking University</a>, advised
    by <a href="https://future.pku.edu.cn/szll/jyxln/4779cf6b628a43029c20350e7f1fdf56.htm">Prof. Lei Ma</a>.
  zh: 我是<strong>北京大学未来技术学院2027年入学直博生</strong>，导师为<a href="https://future.pku.edu.cn/szll/jyxln/4779cf6b628a43029c20350e7f1fdf56.htm">马雷老师</a>。目前就读于<a href="https://www.dlut.edu.cn/">大连理工大学</a><strong>数理基础科学</strong>专业，预计
    2027 年 6 月本科毕业。
bio:
  en: 'Currently, I study <strong>Foundational Mathematical Sciences</strong> at <a href="https://www.dlut.edu.cn/">Dalian University of Technology</a>
    (expected graduation: June 2027), and conduct research at Peking University and the Institute of Automation, Chinese Academy of Sciences. My interests
    lie in <strong>brain-inspired learning, large language models, and reinforcement learning</strong>, with a focus on memory-efficient learning and intelligent
    decision-making.'
  zh: 我关注<strong>类脑计算、大语言模型与强化学习</strong>，希望构建高效、低内存的学习方法，以及面向真实约束的智能决策系统。目前在北京大学和中国科学院自动化研究所开展科研实习，研究涵盖时序信用分配、长上下文建模、协同边缘缓存与神经组合优化。
announcement:
  en: '<strong>Incoming Ph.D. · 2027:</strong> Peking University, College of Future Technology · Advisor: Prof. Lei Ma.'
  zh: <strong>2027年入学直博生 · 北京大学</strong>，未来技术学院 · 导师：马雷老师。
research:
- title:
    en: Brain-inspired learning
    zh: 类脑学习与信用分配
  text:
    en: Online local learning rules for temporal credit assignment, with low memory cost and biologically inspired dynamics.
    zh: 探索具生物启发的在线局部学习规则，以低内存开销实现时序信用分配。
- title:
    en: Language models & reasoning
    zh: 大语言模型与长上下文
  text:
    en: Decision-making LLMs, long-context restoration, and memory-efficient attention distillation.
    zh: 研究决策型大语言模型、长上下文能力恢复与线性内存注意力蒸馏。
- title:
    en: Learning to make decisions
    zh: 强化学习与智能决策
  text:
    en: Reinforcement learning for wireless resource allocation and structured combinatorial optimization.
    zh: 利用强化学习求解无线资源分配、协同缓存与具有结构约束的组合优化问题。
