  alt: LinearARD for long-context RoPE restoration
  title: 'LinearARD: Linear-Memory Attention Distillation for RoPE Restoration'
  authors:
    en: Ning Yang<sup>*†</sup>, Hengyu Zhong<sup>*</sup>, <strong>Wentao Wang</strong><sup>*</sup>, Baoliang Tian, Yuan Zhou, Haijun Zhang, Jun Wang
    zh: Ning Yang<sup>*†</sup>, Hengyu Zhong<sup>*</sup>, <strong>Wentao Wang</strong><sup>*</sup>, Baoliang Tian, Yuan Zhou, Haijun Zhang, Jun Wang
  meta:
    home:
      en: Institute of Automation, Chinese Academy of Sciences
      zh: 中国科学院自动化研究所
    full:
      en: Institute of Automation, Chinese Academy of Sciences | Sep. 2025 - Dec. 2025
      zh: 中国科学院自动化研究所 | 2025 年 9 月 - 2025 年 12 月
  summary:
    en: LinearARD aligns row-wise dense self-relations between native-RoPE teachers and RoPE-scaled students, restoring long-context performance
      with an exact linear-memory distillation objective.
    zh: LinearARD 通过对齐原生 RoPE 教师与缩放 RoPE 学生的行级稠密自关系，实现长上下文恢复蒸馏，并推导精确的线性内存 KL 散度核。
  bullets:
    en:
    - Proposes a restoration-distillation framework that aligns row-wise dense self-relations between a native-RoPE teacher and a RoPE-scaled
      student.
    - Derives an exact linear-memory KL kernel, avoiding explicit construction of full relation matrices on long sequences.
    - On LLaMA2-7B scaled from 4K to 32K, the method recovers 98.3% of short-context performance using only 4.25M training tokens.
    - Responsible for writing the full manuscript.
    zh:
    - 提出一种面向长上下文 LLM 的恢复蒸馏框架，对齐原生 RoPE 教师模型与缩放 RoPE 学生模型之间的行级自关系分布。
    - 推导精确的线性内存 KL 核，避免显式构造完整关系矩阵。
    - 在 LLaMA2-7B 从 4K 扩展到 32K 的设定下，仅用 4.25M 训练 token 即恢复 98.3% 的短上下文性能。
    - 本人负责全文撰写。
