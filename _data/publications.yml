  title: Global Credit Assignment via Dynamical Criticality
  title_url: https://openreview.net/forum?id=jI2TM7Kzlu
  authors:
    en: <strong>Wentao Wang</strong>, Keren Gao, Guozhang Chen
    zh: <strong>Wentao Wang</strong>, Keren Gao, Guozhang Chen
  meta:
    home:
      en: Peking University
      zh: 北京大学
