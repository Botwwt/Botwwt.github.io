      en: Peking University | Oct. 2025 - Present
      zh: 北京大学 | 2025 年 10 月至今
  summary:
    en: This ICML 2026 paper studies temporal credit assignment in recurrent, convolutional recurrent, and spiking systems through criticality-driven
      online local learning with constant activation memory.
    zh: 该 ICML 2026 论文聚焦循环、卷积循环与脉冲系统中的时序信用分配问题，提出基于临界动力学、具有常数激活内存开销的在线局部学习规则。
  bullets:
    en:
    - Studies temporal credit assignment beyond BPTT through a criticality-driven local learning rule.
    - Uses long-range spatial inertia and temporal correlations to approximate global credit propagation with a locally computable teaching signal.
    - Derives a closed-form update requiring constant activation memory and O(H) auxiliary state, and validates accuracy, stability, and scalability
      on RNN, ConvRNN, and SNN benchmarks.
    zh:
    - 围绕 BPTT 之外的时序信用分配问题，提出基于临界动力学的局部学习规则。
    - 利用空间长程惯量和时间长程关联，将全局信用传播近似为局部可计算教学信号。
    - 推导仅需常数级激活内存与 O(H) 辅助状态的闭式更新，并在 RNN、ConvRNN 和 SNN 上验证精度、稳定性与可扩展性。
