    full:
      en: Dalian University of Technology
      zh: 大连理工大学
  summary:
    en: Observation-aware recursive fusion for asynchronous and incomplete mobile and wearable feature views, combining shared-private representations
      with task-conditioned multi-task prediction.
    zh: 面向异步、缺失的移动与可穿戴心理健康特征视图，通过独立编码、缺失信息建模、共享–私有潜变量及任务条件递归融合，实现多任务预测。
  bullets:
    en:
    - Encodes each feature source independently and explicitly models missingness.
    - Combines shared-private latent representations, task-conditioned fusion, and recursive prediction.
    - Achieves leading or competitive results on six tasks across DepreST-CAT and PSYCHE-D.
    zh:
    - 对各特征源独立编码，并显式融入缺失信息。
    - 结合共享–私有潜变量、任务条件融合与递归预测，实现多任务建模。
    - 在 DepreST-CAT 和 PSYCHE-D 的六项任务上取得领先或有竞争力的结果。
  links:
