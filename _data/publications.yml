  title: 'MC-TRCM: Observation-Aware Recursive Fusion for Incomplete Mobile and Wearable Mental-Health Feature Views'
  title_url: https://github.com/Botwwt/MC-TRCM
  authors:
    en: <strong>Wentao Wang</strong>, Lifeng Han, Zining Ren, Hengyu Zhong, Guangyu Zou
    zh: <strong>Wentao Wang</strong>, Lifeng Han, Zining Ren, Hengyu Zhong, Guangyu Zou
