  summary:
    en: CAADRL combines global self-attention, intra-cluster attention, and a dynamic dual-decoder to exploit clustered structure in pickup and
      delivery problems while reducing inference latency.
    zh: 提出 CAADRL 框架，将全局自注意力、簇内注意力与动态双解码器结合，显式利用取送货问题中的聚类结构，并显著降低推理时延。
  bullets:
    en:
    - Proposes CAADRL, a cluster-aware deep reinforcement learning framework for pickup and delivery problems with clustered structure.
    - Integrates global self-attention, intra-cluster attention, and a dynamic dual-decoder with a learnable gate.
    - Achieves leading performance on clustered benchmarks while reducing inference latency relative to neural collaborative-search baselines.
    zh:
    - 提出 CAADRL 框架，用于建模带簇结构的取送货路径优化问题。
    - 将全局自注意力、簇内注意力与带门控的动态双解码器结合，实现宏观簇间决策与微观簇内决策协同。
    - 在簇状基准上取得领先结果，同时显著降低相对神经协同搜索方法的推理开销。
