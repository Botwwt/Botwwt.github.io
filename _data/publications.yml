  summary:
    en: We formulate cooperative multi-base-station edge caching as an LLM-native sequential decision problem, build an SFT+GRPO training pipeline,
      and design an opportunity-aware reward.
    zh: 将多基站协同边缘缓存问题建模为 LLM 原生的序列决策任务，构建 SFT+GRPO 训练流程，并设计机会感知奖励函数。
  bullets:
    en:
    - Builds a multi-BS, multi-user cooperative edge-caching environment and formulates it as an LLM-native sequential decision problem.
    - Implements a two-stage SFT+GRPO training pipeline with TRL, Unsloth, and QLoRA under a strictly validated text-to-action interface.
    - Achieves strong generalization across user scale, base-station count, and request distributions.
    zh:
    - 构建多基站、多用户协同边缘缓存环境，并将任务表述为 LLM 原生的序列决策问题。
    - 基于严格约束的文本到动作接口，实现 SFT+GRPO 两阶段训练流程，并结合 TRL、Unsloth 与 QLoRA。
    - 在用户规模、基站数量和请求分布变化下表现出良好泛化性。
